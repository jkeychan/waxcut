name: Scorecard supply-chain security

on:
  branch_protection_rule:
  schedule:
    - cron: "0 8 * * 2"
  push:
    branches: [ main ]

permissions: {}

jobs:
  analyze:
    name: OpenSSF Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          # A fine-grained PAT scoped to Administration:read-only on this
          # repo only (see #5) — the default GITHUB_TOKEN can't read
          # classic branch protection rules, which Scorecard's
          # Branch-Protection check needs. Not moved into a dedicated,
          # protected Environment: this workflow has no pull_request
          # trigger (push to main, schedule, branch_protection_rule only),
          # so it never runs against attacker-controlled input the way a
          # fork PR would, which is the scenario Environment protection
          # rules primarily guard against.
          repo_token: ${{ secrets.SCORECARD_READ_TOKEN }}
          publish_results: true

      - name: Upload SARIF results
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: results.sarif
