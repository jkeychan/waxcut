name: Dependabot Auto-Merge

on:
  # pull_request_target is required here: a plain `pull_request` run
  # triggered by dependabot's push only gets secrets from the Dependabot
  # secrets store, not this repo's Actions secrets, so DEPENDABOT_MERGE_PAT
  # comes through empty. This workflow never checks out the PR head or runs
  # any code from the diff, so it doesn't have the injection exposure
  # dangerous-triggers normally warns about.
  pull_request_target: # zizmor: ignore[dangerous-triggers] no checkout of PR head, only metadata read + gh CLI calls
    branches: [ main ]

permissions: {}

jobs:
  auto-merge:
    name: Approve and auto-merge minor/patch bumps
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Fetch dependency metadata
        id: metadata
        uses: dependabot/fetch-metadata@08eff52bf64351f401fb50d4972fa95b9f2c2d1b # v3.1.0
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      - name: Approve and enable auto-merge
        if: |
          steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
          steps.metadata.outputs.update-type == 'version-update:semver-minor'
        env:
          GH_TOKEN: "${{ secrets.DEPENDABOT_MERGE_PAT }}"
          PR_URL: "${{ github.event.pull_request.html_url }}"
        run: |
          gh pr review --approve "$PR_URL"
          gh pr merge --auto --squash "$PR_URL"
