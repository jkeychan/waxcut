name: Zizmor

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions: {}

jobs:
  zizmor:
    name: Zizmor - Security Analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install zizmor
        id: install-zizmor
        uses: jaxxstorm/action-install-gh-release@25e24d2d23ae098373794ef1d6faecb48ee52da8 # v3.0.0
        with:
          repo: zizmorcore/zizmor
          tag: v1.29.0

      - name: Run zizmor
        id: run-zizmor
        run: |
          set +e
          echo "PATH: ${PATH}"
          echo "Checking for zizmor..."
          # The action installs to a cached location, check common paths
          if command -v zizmor >/dev/null 2>&1; then
            ZIZMOR_CMD="zizmor"
          elif [ -f "/opt/hostedtoolcache/zizmorcore/zizmor/latest/linux-x64/zizmor" ]; then
            ZIZMOR_CMD="/opt/hostedtoolcache/zizmorcore/zizmor/latest/linux-x64/zizmor"
          elif [ -f "${HOME}/.local/bin/zizmor" ]; then
            ZIZMOR_CMD="${HOME}/.local/bin/zizmor"
          elif [ -f "./zizmor" ]; then
            ZIZMOR_CMD="./zizmor"
          else
            echo "Error: zizmor binary not found"
            echo "Checking common installation paths..."
            find /opt/hostedtoolcache -name "zizmor" 2>/dev/null || true
            exit 1
          fi
          "${ZIZMOR_CMD}" .github/workflows
          human_exit=$?
          "${ZIZMOR_CMD}" --format sarif .github/workflows > results.sarif
          exit "${human_exit}"

      - name: Upload SARIF results
        # Fork PRs run with a read-only token that can't upload SARIF —
        # `always()` alone would give the first external contributor a red
        # required check they have no way to fix. Still upload on any
        # same-repo failure (push to main, or a PR from a branch in this
        # repo); skip only when the PR head is a fork.
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          sarif_file: results.sarif
