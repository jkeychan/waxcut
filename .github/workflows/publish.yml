name: Publish to PyPI

on:
  release:
    types: [published]

permissions: {}

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          # Pin the uv binary itself (distinct from the setup-uv action
          # above) so a future uv release can't silently change build
          # hermeticity in the job that produces the published artifact.
          version: "0.10.12"
          # This workflow only ever runs in a release context (see `on:`
          # above) — never enable the cache here, since a poisoned Actions
          # cache restored during a release build could compromise the
          # published artifact before it reaches PyPI.
          enable-cache: false

      - name: Verify release tag matches pyproject.toml version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          PYPROJECT_VERSION="$(grep -m1 '^version = ' pyproject.toml | sed -E 's/version = "(.*)"/\1/')"
          EXPECTED_TAG="v${PYPROJECT_VERSION}"
          if [ "${RELEASE_TAG}" != "${EXPECTED_TAG}" ]; then
            echo "Release tag '${RELEASE_TAG}' does not match pyproject.toml version '${PYPROJECT_VERSION}' (expected tag '${EXPECTED_TAG}')" >&2
            exit 1
          fi
          echo "Release tag '${RELEASE_TAG}' matches pyproject.toml version '${PYPROJECT_VERSION}'"

      - name: Build
        run: uv build

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/

  # Runs automatically on every release, no approval needed: signs the
  # build with SLSA provenance and attaches it to the GitHub Release.
  # Deliberately has no PyPI credentials and no way to publish anywhere —
  # separated from the `publish` job below so that cutting a release
  # never implies a PyPI upload without an explicit, separate approval.
  attest-and-attach:
    name: Sign and attach release assets
    needs: build
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Attest build provenance
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/*"

      - name: Attach dist and provenance to the release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
          REPO: ${{ github.repository }}
        run: |
          cp "${BUNDLE_PATH}" provenance.sigstore.json
          gh release upload "${RELEASE_TAG}" dist/* provenance.sigstore.json \
            --repo "${REPO}"

  # Gated by the `pypi` environment's required-reviewer rule: this job
  # pauses for manual approval in the Actions UI before it runs.
  publish:
    name: Publish to PyPI
    needs: attest-and-attach
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      # Publishes via PyPI Trusted Publishing (OIDC — no API token) and, in
      # the same credentialed step, generates and uploads PEP 740
      # attestations. Attestations have to be produced here rather than in
      # `attest-and-attach`: PyPI validates the attestation's Sigstore
      # identity against the Trusted Publisher performing the upload, so the
      # signing identity and the publishing identity must be the same one.
      # The bundle attached to the GitHub Release above is a separate
      # artifact for `gh attestation verify` and is not consumed by PyPI.
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          attestations: true
